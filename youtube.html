<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Station</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0d0d0d; color: #fff; font-family: sans-serif; text-align: center; }
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #ff0000; font-size: 24px; margin-bottom: 20px; }
        
        /* Keeps the video responsive on mobile and desktops */
        .video-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .back-btn { display: inline-block; margin-top: 25px; background: #222; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; border: 1px solid #444; }
        .back-btn:hover { background: #333; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Media Station</h1>
        
        <div class="video-box">
            <!-- 
              CRITICAL: Use /embed/ instead of watch?v= 
              Replace "dQw4w9WgXcQ" with any video ID you want to load!
            -->
            <iframe src="https://youtube.com/embed/DTcVjuiV6Jo/" allowfullscreen></iframe>
        </div>

        <a href="index.html" class="back-btn">⬅ Back to Games</a>
    </div>

</body>
</html>
