<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Games</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #0070f3; }
        
        /* Hidden layout by default */
        #main-content { display: none; }

        /* Navigation Grid */
        .game-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
        .game-card { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; text-decoration: none; color: white; min-width: 150px; }
        .game-card:hover { border-color: #0070f3; background: #222; }

        /* Fullscreen Password Overlay Screen */
        #password-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0d0d0d; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
        }
        .gate-box { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .gate-box h2 { margin-top: 0; font-size: 20px; }
        .gate-box input { background: #222; border: 1px solid #444; color: white; padding: 12px; font-size: 16px; border-radius: 6px; width: 80%; text-align: center; outline: none; margin-bottom: 15px; }
        .gate-box input:focus { border-color: #0070f3; }
        .gate-box button { background: #0070f3; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 90%; }
        .gate-box button:hover { background: #0056b3; }
        #error-msg { color: #ff3333; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- 1. THE PASSWORD GATE SCREEN -->
    <div id="password-gate">
        <div class="gate-box">
            <h2>🔑 Access Restricted</h2>
            <p>Enter the security code to view games.</p>
            <input type="password" id="pass-input" placeholder="Enter Password" autofocus>
            <br>
            <button onclick="checkPassword()">Unlock Site</button>
            <div id="error-msg">Incorrect Code. Try again.</div>
        </div>
    </div>

    <!-- 2. THE MAIN WEBSITE CONTENT (Hidden Until Unlocked) -->
    <div id="main-content">
        <h1>My Unblocked Games Site</h1>
        <p>Welcome! Click a game below to play.</p>

        <div class="game-grid">
            <a href="retro-bowl.html" class="game-card">🏈 Retro Bowl</a>
            <a href="youtube.html" class="game-card">📺 YouTube</a>
            <a href="drift-hunters.html" class="game-card">🏎️ Drift Hunters</a>
        </div>
    </div>

    <!-- 3. SECURITY GATE LOGIC -->
    <script>
        function checkPassword() {
            const input = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');
            
            // CHANGE "1234" BELOW TO WHATEVER PASSWORD YOU WANT!
            if (input === "5873") {
                // Hide gate and show content
                document.getElementById('password-gate').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                // Show error message
                errorMsg.style.display = 'block';
                document.getElementById('pass-input').value = ""; // clear input
            }
        }

        // Allows hitting "Enter" on phone keyboards to unlock
        document.getElementById('pass-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
