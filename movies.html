<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎬 Movie Hub</h1>

    <input
      id="search"
      type="search"
      placeholder="Search movies..."
      autocomplete="off"
    >
  </header>

  <main>

    <section class="hero">
      <h2>Movies</h2>
      <p>Choose a movie below to start watching.</p>
    </section>

    <div id="movieGrid" class="movie-grid"></div>

  </main>

  <!-- Video Player -->
  <div id="playerModal" class="modal" hidden>

    <div class="player-box">

      <button id="closePlayer" class="close">✕</button>

      <h2 id="playerTitle"></h2>

      <video
        id="videoPlayer"
        controls
        playsinline
      ></video>

      <p id="playerDescription"></p>

    </div>

  </div>

  <script src="script.js"></script>
