<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bowl Unblocked</title>
    <style>
        /* Forces the game window to fill the entire browser screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* Absolute positioning handles fullscreen sizing cleanly */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Small mobile floating back button to return to your main page */
        .back-button {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 112, 243, 0.85);
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Floating navigation helper -->
    <a href="index.html" class="back-button">⬅ Home</a>

    <!-- Embedded Retro Bowl Engine -->
    <iframe src="https://3kh0.github.io/retro-bowl/" allowfullscreen="true"></iframe>

</body>
</html>
